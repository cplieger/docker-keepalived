# Minimal valid VRRP config used by both of this repo's tests: tests/smoke.sh
# parses it with keepalived's config-test mode (-t) at build time, and the
# runtime image-smoke harness (tests/image-smoke.conf) bind-mounts it at the
# compiled-in default path as the real config of a started container. Keep it
# valid for both.
#
# The tracked script is a file test rather than /bin/true so the runtime test
# can flip the tracked result from inside the container, and it carries no
# weight, so a failing script drives the instance into FAULT instead of only
# lowering its priority. /usr/bin/test is the path that exists in this image:
# there is no /bin/test, and keepalived resolves the symlink and security
# checks the target (/bin/busybox), not the link.
#
# notify_master points at an in-image applet because keepalived refuses any
# script whose owner is not root, and a script committed under tests/ is owned
# by the CI runner. VI_UNSAFE points at a script the runtime test generates
# world-writable, which keepalived must refuse while VI_TEST still takes its
# own VIP, so a single run observes both answers.
#
# script_user root is required because enable_script_security makes keepalived
# validate the run-as user, and this image has no keepalived_script user.
# Without it, -t exits 5, which is the negative control tests/smoke.sh asserts.
#
# The virtual_router_id values are high on purpose. This config runs on a
# docker bridge in CI, and if it ever reached a real LAN it must not compete
# with a live VRRP instance for one of the low ids deployments actually use.
global_defs {
    enable_script_security
    script_user root
}

vrrp_script chk_test {
    script "/usr/bin/test ! -f /tmp/keepalived-smoke-fault"
    interval 1
    fall 1
    rise 1
}

vrrp_instance VI_TEST {
    state BACKUP
    interface eth0
    virtual_router_id 251
    priority 100
    advert_int 1
    virtual_ipaddress {
        192.168.255.254/24
    }
    track_script {
        chk_test
    }
    notify_master "/bin/touch /tmp/keepalived-smoke-master"
}

vrrp_instance VI_UNSAFE {
    state BACKUP
    interface eth0
    virtual_router_id 252
    priority 100
    advert_int 1
    virtual_ipaddress {
        192.168.255.253/24
    }
    notify_master "/etc/keepalived/insecure/notify.sh"
}
