# Minimal valid VRRP config used by both of this repo's tests:
# tests/smoke.sh parses it with keepalived's config-test mode (-t) at
# build time, and the runtime image-smoke harness
# (tests/image-smoke.conf) bind-mounts it at the compiled-in default
# path as the real config of a started container. Keep it valid for
# both; the rest of this header explains the -t half.
#
# enable_script_security + vrrp_script/track_script are included so `-t`
# parses the script-security code path — the #1 documented operator footgun.
# /bin/true is used because `-t` DOES apply the script-path permission
# check (validate_config -> vrrp_complete_init -> check_script_secure):
# busybox's /bin/true and its path components are root-owned and not
# group/world-writable, so no fixture script has to be created for it.
#
# script_user root is required because enable_script_security makes keepalived
# validate that the script's run-as user exists; the image has no
# keepalived_script user, so without this `-t` fails (rc 5). root is fine for a
# parse-only test config that never executes the script.
global_defs {
    enable_script_security
    script_user root
}

vrrp_script chk_test {
    script "/bin/true"
    interval 2
    weight 2
}

vrrp_instance VI_TEST {
    state BACKUP
    interface eth0
    virtual_router_id 51
    priority 100
    advert_int 1
    virtual_ipaddress {
        192.168.255.254/24
    }
    track_script {
        chk_test
    }
}
