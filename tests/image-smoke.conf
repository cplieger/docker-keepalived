# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced from cplieger/ci). Runs the assembled image with the same fixture the
# build-time smoke test parses, mounted at the compiled-in default config path
# so the real ENTRYPOINT is exercised with no -f, and waits for the baked
# HEALTHCHECK. Past the health gate, smoke_verify drives a real failover, then
# runs the negative controls CONTRIBUTING.md describes: each is a second
# container from the same image that must not come up healthy.
SMOKE_APP_NAME=docker-keepalived
# HEALTHCHECK start-period is 15s; 90 covers it plus two 30s intervals.
SMOKE_TIMEOUT=90

# Health already proves PID 1 has a keepalived child; this line proves it is
# the VRRP child the mounted config asked for and not the LVS checker.
SMOKE_LOG_PATTERN="Starting VRRP child process"

KA_IFACE=eth0
KA_VIP=192.168.255.254
KA_FAULT_FILE=/tmp/keepalived-smoke-fault
KA_MASTER_MARKER=/tmp/keepalived-smoke-master
KA_UNSAFE_MARKER=/tmp/keepalived-smoke-insecure
# Counted twice each, a baseline and then the assertion against it, so spelled
# once. Both are bound to VI_TEST: the same wording is logged per instance.
KA_FAULT_LINE='(VI_TEST) Entering FAULT STATE'
KA_ZERO_PRIO_LINE='(VI_TEST) sent 0 priority'
# The two lines the no-interface control observes at runtime, and the two
# alternatives KeepalivedPermanentError in alerts/logql.yaml must select:
# spelled once so the rule check and the runtime control cannot drift apart.
KA_NOIFACE_LINE='Non-existent interface specified in configuration'
KA_PERMANENT_LINE='exited with permanent error'
# keepalived's own exit statuses (lib/scheduler.h): no readable main config,
# and a child that ended with a permanent CONFIG error.
KA_EXIT_NO_CONFIG=6
KA_EXIT_CONFIG=2

ka_log_count() { docker logs "$SMOKE_CONTAINER" 2>&1 | grep -cF -- "$1" || true; }
ka_logged() { [ "$(ka_log_count "$1")" -gt 0 ]; }
ka_logged_in() { docker logs "$1" 2>&1 | grep -qF -- "$2"; }
ka_count_grew() { [ "$(ka_log_count "$1")" -gt "$2" ]; }
ka_addrs() { docker exec "$SMOKE_CONTAINER" ip -4 -o addr show dev "$KA_IFACE"; }
ka_holds_vip() { ka_addrs 2>/dev/null | grep -qF -- "$KA_VIP"; }
# The one negative assertion, so it must not read a failed probe as an absent
# address: a swallowed docker exec error would satisfy it.
ka_released_vip() {
  _addrs=$(ka_addrs) || return 1
  ! printf '%s\n' "$_addrs" | grep -qF -- "$KA_VIP"
}
ka_notified() { docker exec "$SMOKE_CONTAINER" test -e "$KA_MASTER_MARKER"; }

# Bounded poll, never a single grep: the json-file log driver lags the event
# that produced the line.
ka_wait() {
  _secs=$1
  _what=$2
  shift 2
  _i=0
  while [ "$_i" -le "$_secs" ]; do
    if "$@"; then return 0; fi
    _i=$((_i + 1))
    sleep 1
  done
  printf 'FAIL: %s\n' "$_what" >&2
  return 1
}

verify_alert_selectors_match_compose() {
  repo_root=${SMOKE_DIR%/tests}
  container_name=$(docker compose -f "$repo_root/compose.yaml" config --format json | jq -er '.services.keepalived.container_name') || {
    printf '%s\n' 'FAIL: compose.yaml has no resolved keepalived container name' >&2
    return 1
  }
  selectors=$(grep -o 'container="[^"]*"' "$repo_root/alerts/logql.yaml" | sort -u)
  if [ "$selectors" != "container=\"$container_name\"" ]; then
    printf 'FAIL: alerts/logql.yaml selectors (%s) do not all match compose container_name %s\n' "$(printf '%s' "$selectors" | tr '\n' ' ')" "$container_name" >&2
    return 1
  fi
  # Every alert LEG opens with exactly one range aggregation over a stream
  # selector and must carry exactly one selector, so these two counts are
  # equal. Exact, not bounded: a single leg that loses or re-keys its selector
  # makes them differ. Counting `- alert:` lines instead would say nothing
  # until five selectors had vanished, because three rules carry more than one
  # leg (DuplicateMaster four, ConfigError and ConfigUnusable two each) - and
  # that margin moves every time a leg is added, which is why the equality
  # above is exact.
  #
  # Match any `*_over_time(`, never `count_over_time(` alone. The two state
  # rules read the LATEST status per object with `last_over_time` rather than
  # counting events, so a hardcoded function name made this assertion measure
  # the wrong thing the moment a leg changed aggregation: it reported 10 legs
  # against 12 selectors and failed the build for a selector that was present.
  legs=$(grep -cE '_over_time\(' "$repo_root/alerts/logql.yaml")
  matches=$(grep -c 'container="' "$repo_root/alerts/logql.yaml")
  if [ "$legs" != "$matches" ]; then
    printf 'FAIL: alerts/logql.yaml has %s alert legs but %s container selectors\n' "$legs" "$matches" >&2
    return 1
  fi
}
verify_alert_selectors_match_compose

# Prints the expr of one rule in alerts/logql.yaml: the lines between that
# rule's `expr:` and its `for:`. Empty when the rule is absent or has no expr,
# which the caller must treat as a failure and never as "nothing to check".
ka_rule_expr() {
  awk -v rule="$1" '
    $1 == "-" && $2 == "alert:" { in_rule = ($3 == rule); in_expr = 0; next }
    in_rule && $1 == "expr:" { in_expr = 1; if (NF > 1 && $2 != "|" && $2 != ">") { sub(/^[ \t]*expr:[ \t]*/, ""); print }; next }
    in_rule && in_expr && $1 == "for:" { in_expr = 0 }
    in_rule && in_expr { print }
  ' "$2"
}

# The runtime control below proves keepalived still emits both lines; this
# proves the shipped rule still selects them. Without it, dropping either
# alternative from the matcher leaves every other check green.
verify_permanent_error_rule_selects_runtime_lines() {
  repo_root=${SMOKE_DIR%/tests}
  expr=$(ka_rule_expr KeepalivedPermanentError "$repo_root/alerts/logql.yaml")
  if [ -z "$expr" ]; then
    printf 'FAIL: alerts/logql.yaml has no KeepalivedPermanentError rule with an expr\n' >&2
    return 1
  fi
  for line in "$KA_NOIFACE_LINE" "$KA_PERMANENT_LINE"; do
    if ! printf '%s\n' "$expr" | grep -qF -- "$line"; then
      printf 'FAIL: KeepalivedPermanentError no longer selects "%s", which the no-interface control observes at runtime\n' "$line" >&2
      return 1
    fi
  done
}
verify_permanent_error_rule_selects_runtime_lines

verify_compose_contract() {
  repo_root=${SMOKE_DIR%/tests}
  compose_json=$(docker compose -f "$repo_root/compose.yaml" config --format json) || {
    printf '%s\n' 'FAIL: compose.yaml does not resolve' >&2
    return 1
  }
  # Three of these four have a runtime outcome: without host networking the
  # container cannot see VRRP multicast, without NET_ADMIN it cannot move the
  # VIP, without NET_RAW it cannot build an advert. The fourth is pinned for a
  # different reason and it is not generic hardening: README "Security"
  # publishes /etc/keepalived read-only as the only bind mount the image
  # needs, and a writable one gives a root container holding NET_ADMIN write
  # access to the very track and notify scripts keepalived executes.
  if ! printf '%s\n' "$compose_json" | jq -e '
    .services.keepalived
    | .network_mode == "host"
      and ((.cap_add | index("NET_ADMIN")) != null)
      and ((.cap_add | index("NET_RAW")) != null)
      and any(.volumes[]; .target == "/etc/keepalived" and .read_only == true)
  ' >/dev/null; then
    printf '%s\n' 'FAIL: compose.yaml must keep host networking, NET_ADMIN, NET_RAW, and a read-only /etc/keepalived mount' >&2
    return 1
  fi
}
verify_compose_contract

# Two generated fixtures. VI_UNSAFE's notify script is generated rather than
# committed because it has to be WORLD-WRITABLE in every environment for
# keepalived to refuse it, and git carries no such mode; the empty config is
# what the third negative control boots on. Both are acquired after the gates
# above rather than beside the knobs at the top: a gate that fails at source
# time exits before the harness arms its EXIT trap, so anything acquired
# earlier is left on the host.
SMOKE_FIXTURE_DIR=$(mktemp -d)
# Negative-control containers share the harness's name shape so a leaked one
# is recognisable; $$ is the harness's PID because this file is sourced.
KA_BOOT_PREFIX="smoke-${SMOKE_APP_NAME}-$$-boot"
# Release what the lines above acquired and what smoke_verify starts: the
# harness's EXIT trap calls this after removing its own container, and the
# failure path below calls it directly.
# shellcheck disable=SC2329  # invoked indirectly via the harness EXIT trap
smoke_cleanup() {
  docker rm -f "$KA_BOOT_PREFIX-noconf" "$KA_BOOT_PREFIX-noiface" "$KA_BOOT_PREFIX-idle" >/dev/null 2>&1 || true
  rm -rf "$SMOKE_FIXTURE_DIR"
}
if ! printf '#!/bin/sh\nprintf fired >>/tmp/keepalived-smoke-insecure\n' \
  >"$SMOKE_FIXTURE_DIR/notify.sh" \
  || ! printf 'global_defs {\n}\n' >"$SMOKE_FIXTURE_DIR/empty.conf" \
  || ! chmod 0777 "$SMOKE_FIXTURE_DIR" "$SMOKE_FIXTURE_DIR/notify.sh" \
  || ! chmod 0644 "$SMOKE_FIXTURE_DIR/empty.conf"; then
  printf 'FAIL: could not write the generated fixtures\n' >&2
  smoke_cleanup
  exit 1
fi

SMOKE_RUN_ARGS="--cap-add NET_ADMIN --cap-add NET_RAW -v ${SMOKE_DIR}/keepalived.conf:/etc/keepalived/keepalived.conf:ro -v ${SMOKE_FIXTURE_DIR}:/etc/keepalived/insecure:ro"

# Boots a second container from the image under test in the foreground and
# requires it to exit on its own with exactly the keepalived status the caller
# expects: an equal status proves keepalived reached the documented exit arm,
# where any non-zero status would also accept a crash or a runner kill. 124 is
# GNU timeout's own code and means the container was still running at the
# deadline, which is the defect this exists to catch; 125-127 are docker's and
# mean the run never reached keepalived. Prints the status for the payload line.
ka_boot_must_fail() {
  _name=$1
  _expected=$2
  _what=$3
  shift 3
  _rc=0
  _out=$(timeout 30 docker run --name "$_name" --network none "$@" "$KA_IMAGE" 2>&1) || _rc=$?
  case $_rc in
    124)
      printf 'FAIL: %s: the container was still running after 30s\n%s\n' "$_what" "$_out" >&2
      return 1
      ;;
    125 | 126 | 127)
      printf 'FAIL: %s: docker run failed before keepalived started (%s)\n%s\n' "$_what" "$_rc" "$_out" >&2
      return 1
      ;;
  esac
  if [ "$_rc" -ne "$_expected" ]; then
    printf 'FAIL: %s: expected keepalived to exit %s, the container exited %s\n%s\n' "$_what" "$_expected" "$_rc" "$_out" >&2
    return 1
  fi
  printf '%s\n' "$_rc"
}

# Running state and health status of a container the harness did not start, in
# one inspect so the two cannot come from different moments. The idle control
# requires exactly "true unhealthy": a stopped container keeps the last health
# status it had, so health alone would accept a parent that exited.
ka_state_of() { docker inspect --format '{{ .State.Running }} {{ if .State.Health }}{{ .State.Health.Status }}{{ else }}none{{ end }}' "$1" 2>/dev/null; }
ka_running_unhealthy() { [ "$(ka_state_of "$1")" = 'true unhealthy' ]; }

# A live genhash inside the container: the same executable as keepalived,
# invoked under the name that switches it to genhash mode, held open by a
# listener that never answers so it spans the accelerated probe window. The
# probe must not count it. genhash exits on a refused connection, so the
# listener is confirmed before genhash connects; a genhash that dies early is
# caught by the liveness check in the control, never read as a pass.
ka_hold_genhash() {
  docker exec -d "$1" sh -c '
    sleep 300 | nc -l -s 127.0.0.1 -p 8080 &
    i=0
    while ! grep -q ":1F90 00000000:0000 0A" /proc/net/tcp; do
      i=$((i + 1))
      [ "$i" -lt 30 ] || exit 1
      sleep 1
    done
    exec genhash -s 127.0.0.1 -p 8080 -u / -t 300'
}
ka_genhash_alive() { docker exec "$1" pgrep -x genhash >/dev/null 2>&1; }

smoke_verify() {
  KA_IMAGE=$(docker inspect --format '{{ .Config.Image }}' "$SMOKE_CONTAINER")

  ka_wait 20 'VI_TEST never reached MASTER' ka_logged '(VI_TEST) Entering MASTER STATE'
  ka_wait 10 "VI_TEST is MASTER but ${KA_VIP} is not on ${KA_IFACE}" ka_holds_vip
  ka_wait 10 "notify_master never ran (${KA_MASTER_MARKER} absent)" ka_notified

  ka_wait 20 'VI_UNSAFE never reached MASTER' ka_logged '(VI_UNSAFE) Entering MASTER STATE'
  ka_wait 5 'no refusal logged for the world-writable notify script' ka_logged 'Unsafe permissions found for script'
  # Single-shot absence, after the refusal wait above proved the line keepalived
  # logs when it disables a script is already in this log.
  if docker exec "$SMOKE_CONTAINER" test -e "$KA_UNSAFE_MARKER"; then
    printf 'FAIL: keepalived ran a world-writable notify script\n' >&2
    return 1
  fi

  ka_faults_before=$(ka_log_count "$KA_FAULT_LINE")
  docker exec "$SMOKE_CONTAINER" touch "$KA_FAULT_FILE"
  ka_wait 15 'a failing tracked script did not put VI_TEST in FAULT' ka_count_grew "$KA_FAULT_LINE" "$ka_faults_before"
  ka_wait 10 "VI_TEST entered FAULT but still holds ${KA_VIP}" ka_released_vip
  docker exec "$SMOKE_CONTAINER" rm -f "$KA_FAULT_FILE"
  ka_wait 20 "VI_TEST did not retake ${KA_VIP} after its tracked script recovered" ka_holds_vip

  # The FAULT transition above already sent a priority-zero advert of its own, so
  # the baseline belongs here, after it, and the shutdown must add a new one.
  ka_zeros_before=$(ka_log_count "$KA_ZERO_PRIO_LINE")
  docker stop --time 10 "$SMOKE_CONTAINER" >/dev/null
  ka_wait 10 'graceful shutdown emitted no new priority-zero advert' ka_count_grew "$KA_ZERO_PRIO_LINE" "$ka_zeros_before"

  # Negative controls. Nothing is mounted at the config path, so the parent
  # exits before starting a child; keepalived logs nothing for a config file
  # that does not exist, so the exit status is the whole assertion.
  ka_noconf_rc=$(ka_boot_must_fail "$KA_BOOT_PREFIX-noconf" "$KA_EXIT_NO_CONFIG" 'a container with no config file did not fail to boot')

  # The same fixture the healthy run used, in a namespace with no eth0: the
  # VRRP child rejects it and the parent must exit with it rather than idle
  # as a healthy container holding no VIP. The two lines are the ones the
  # source-time gate above proved KeepalivedPermanentError selects.
  ka_noiface_rc=$(ka_boot_must_fail "$KA_BOOT_PREFIX-noiface" "$KA_EXIT_CONFIG" 'a config naming an interface the container lacks did not fail to boot' \
    -v "${SMOKE_DIR}/keepalived.conf:/etc/keepalived/keepalived.conf:ro")
  ka_wait 10 'the VRRP child did not report the missing interface' \
    ka_logged_in "$KA_BOOT_PREFIX-noiface" "$KA_NOIFACE_LINE"
  ka_wait 10 'the parent did not report the VRRP child exiting with a permanent error' \
    ka_logged_in "$KA_BOOT_PREFIX-noiface" "$KA_PERMANENT_LINE"

  # A config that parses and declares nothing leaves the parent up with no
  # child, so this one never exits and the healthcheck is what must report it,
  # while a live genhash (a keepalived process that is not a child of PID 1)
  # must not rescue it. The probe's timing is overridden so the verdict arrives
  # in seconds rather than the baked start period plus three 30s intervals; the
  # probe command itself stays the image's own.
  docker run -d --name "$KA_BOOT_PREFIX-idle" --network none \
    --health-interval 2s --health-retries 3 --health-start-period 1s \
    -v "${SMOKE_FIXTURE_DIR}/empty.conf:/etc/keepalived/keepalived.conf:ro" "$KA_IMAGE" >/dev/null
  ka_wait 10 'an empty config was not reported as having nothing to run' \
    ka_logged_in "$KA_BOOT_PREFIX-idle" 'has no configuration to run'
  ka_hold_genhash "$KA_BOOT_PREFIX-idle"
  ka_wait 30 'genhash did not stay alive inside the idle container' ka_genhash_alive "$KA_BOOT_PREFIX-idle"
  ka_wait 30 'a keepalived with no configuration to run did not go unhealthy while still running' \
    ka_running_unhealthy "$KA_BOOT_PREFIX-idle"
  # Single-shot, after the verdict: the genhash the probe had to ignore was
  # still there when unhealthy was reached, so the verdict was not reached by
  # it exiting first.
  if ! ka_genhash_alive "$KA_BOOT_PREFIX-idle"; then
    printf 'FAIL: genhash exited before the idle container reached unhealthy, so the control did not test the probe against it\n' >&2
    return 1
  fi

  # Every ka_wait above is silent on success, so name what was proved: a run that
  # drove all four transitions and one whose hook returned early otherwise print
  # the same thing, leaving the harness's elapsed time unaccountable.
  printf 'keepalived payload: VI_TEST took MASTER and put %s on %s with notify_master run under a renamed VRRP child, the world-writable notify script was refused and never ran, a failing tracked script drove FAULT and released the VIP before recovery retook it, the graceful stop emitted a new priority-zero advert, and the three negative controls held: no config file exited %s, a missing interface made the VRRP child exit and the parent follow with %s, and a config with nothing to run went unhealthy with a live genhash not counted as a child\n' "$KA_VIP" "$KA_IFACE" "$ka_noconf_rc" "$ka_noiface_rc"
}
