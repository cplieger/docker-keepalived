# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced from cplieger/ci). Runs the assembled image with the same fixture the
# build-time smoke test parses, mounted at the compiled-in default config path
# so the real ENTRYPOINT is exercised with no -f, and waits for the baked
# HEALTHCHECK. Past the health gate, smoke_verify drives a real failover: the
# shipped binary must take the VIP, run a notify script, refuse a
# world-writable one, drop the VIP when its tracked script fails, and take it
# back when the script recovers. Neither pidof nor any log line proves the
# address moved.
SMOKE_APP_NAME=docker-keepalived
# HEALTHCHECK start-period is 15s; 90 covers it plus two 30s intervals.
SMOKE_TIMEOUT=90

# pidof is satisfied by the parent alone, and keepalived keeps the parent
# running when it parsed no VRRP configuration ("Warning - keepalived has no
# configuration to run"). The parent logs this line only when the mounted
# config yielded VRRP configuration, so it is what proves the mount was read.
SMOKE_LOG_PATTERN="Starting VRRP child process"

KA_IFACE=eth0
KA_VIP=192.168.255.254
KA_FAULT_FILE=/tmp/keepalived-smoke-fault
KA_MASTER_MARKER=/tmp/keepalived-smoke-master
KA_UNSAFE_MARKER=/tmp/keepalived-smoke-insecure
# Counted twice each — a baseline, then the assertion against it — so spelled
# once. Both are bound to VI_TEST: the same wording is logged per instance.
KA_FAULT_LINE='(VI_TEST) Entering FAULT STATE'
KA_ZERO_PRIO_LINE='(VI_TEST) sent 0 priority'

ka_log_count() { docker logs "$SMOKE_CONTAINER" 2>&1 | grep -cF -- "$1" || true; }
ka_logged() { [ "$(ka_log_count "$1")" -gt 0 ]; }
ka_count_grew() { [ "$(ka_log_count "$1")" -gt "$2" ]; }
ka_addrs() { docker exec "$SMOKE_CONTAINER" ip -4 -o addr show dev "$KA_IFACE"; }
ka_holds_vip() { ka_addrs 2>/dev/null | grep -qF -- "$KA_VIP"; }
# The one negative assertion, so it must not read a failed probe as an absent
# address: a swallowed docker exec error would satisfy it.
ka_released_vip() {
  _addrs=$(ka_addrs) || return 1
  ! printf '%s\n' "$_addrs" | grep -qF -- "$KA_VIP"
}
ka_notified() { docker exec "$SMOKE_CONTAINER" test -e "$KA_MASTER_MARKER"; }

# Bounded poll, never a single grep: the json-file log driver lags the event
# that produced the line.
ka_wait() {
  _secs=$1
  _what=$2
  shift 2
  _i=0
  while [ "$_i" -le "$_secs" ]; do
    if "$@"; then return 0; fi
    _i=$((_i + 1))
    sleep 1
  done
  printf 'FAIL: %s\n' "$_what" >&2
  return 1
}

verify_alert_selectors_match_compose() {
  repo_root=${SMOKE_DIR%/tests}
  container_name=$(docker compose -f "$repo_root/compose.yaml" config --format json | jq -er '.services.keepalived.container_name') || {
    printf '%s\n' 'FAIL: compose.yaml has no resolved keepalived container name' >&2
    return 1
  }
  selectors=$(grep -o 'container="[^"]*"' "$repo_root/alerts/logql.yaml" | sort -u)
  if [ "$selectors" != "container=\"$container_name\"" ]; then
    printf 'FAIL: alerts/logql.yaml selectors (%s) do not all match compose container_name %s\n' "$(printf '%s' "$selectors" | tr '\n' ' ')" "$container_name" >&2
    return 1
  fi
  # Every alert LEG opens with exactly one range aggregation over a stream
  # selector and must carry exactly one selector, so these two counts are
  # equal. Exact, not bounded: a single leg that loses or re-keys its selector
  # makes them differ. Counting `- alert:` lines instead would need four
  # selectors to vanish before it said anything, because two rules carry two
  # legs each.
  #
  # Match any `*_over_time(`, never `count_over_time(` alone. The two state
  # rules read the LATEST status per object with `last_over_time` rather than
  # counting events, so a hardcoded function name made this assertion measure
  # the wrong thing the moment a leg changed aggregation: it reported 10 legs
  # against 12 selectors and failed the build for a selector that was present.
  legs=$(grep -cE '_over_time\(' "$repo_root/alerts/logql.yaml")
  matches=$(grep -c 'container="' "$repo_root/alerts/logql.yaml")
  if [ "$legs" != "$matches" ]; then
    printf 'FAIL: alerts/logql.yaml has %s alert legs but %s container selectors\n' "$legs" "$matches" >&2
    return 1
  fi
}
verify_alert_selectors_match_compose

verify_compose_contract() {
  repo_root=${SMOKE_DIR%/tests}
  compose_json=$(docker compose -f "$repo_root/compose.yaml" config --format json) || {
    printf '%s\n' 'FAIL: compose.yaml does not resolve' >&2
    return 1
  }
  # Three of these four have a runtime outcome: without host networking the
  # container cannot see VRRP multicast, without NET_ADMIN it cannot move the
  # VIP, without NET_RAW it cannot build an advert. The fourth is pinned for a
  # different reason and it is not generic hardening: README "Security"
  # publishes /etc/keepalived read-only as the only bind mount the image
  # needs, and a writable one gives a root container holding NET_ADMIN write
  # access to the very track and notify scripts keepalived executes.
  if ! printf '%s\n' "$compose_json" | jq -e '
    .services.keepalived
    | .network_mode == "host"
      and ((.cap_add | index("NET_ADMIN")) != null)
      and ((.cap_add | index("NET_RAW")) != null)
      and any(.volumes[]; .target == "/etc/keepalived" and .read_only == true)
  ' >/dev/null; then
    printf '%s\n' 'FAIL: compose.yaml must keep host networking, NET_ADMIN, NET_RAW, and a read-only /etc/keepalived mount' >&2
    return 1
  fi
}
verify_compose_contract

# VI_UNSAFE's notify script, generated rather than committed because it has to
# be WORLD-WRITABLE in every environment for keepalived to refuse it, and git
# carries no such mode. It is acquired after the gates above rather than beside
# the knobs at the top: a gate that fails at source time exits before the
# harness arms its EXIT trap, so anything acquired earlier is left on the host.
SMOKE_INSECURE_DIR=$(mktemp -d)
# Release what the line above acquired: the harness's EXIT trap calls this
# after removing the container, and the failure path below calls it directly.
# shellcheck disable=SC2329  # invoked indirectly via the harness EXIT trap
smoke_cleanup() {
  rm -rf "$SMOKE_INSECURE_DIR"
}
if ! printf '#!/bin/sh\nprintf fired >>/tmp/keepalived-smoke-insecure\n' \
  >"$SMOKE_INSECURE_DIR/notify.sh" \
  || ! chmod 0777 "$SMOKE_INSECURE_DIR" "$SMOKE_INSECURE_DIR/notify.sh"; then
  printf 'FAIL: could not write the world-writable notify fixture\n' >&2
  smoke_cleanup
  exit 1
fi

SMOKE_RUN_ARGS="--cap-add NET_ADMIN --cap-add NET_RAW -v ${SMOKE_DIR}/keepalived.conf:/etc/keepalived/keepalived.conf:ro -v ${SMOKE_INSECURE_DIR}:/etc/keepalived/insecure:ro"

smoke_verify() {
  ka_wait 20 'VI_TEST never reached MASTER' ka_logged '(VI_TEST) Entering MASTER STATE'
  ka_wait 10 "VI_TEST is MASTER but ${KA_VIP} is not on ${KA_IFACE}" ka_holds_vip
  ka_wait 10 "notify_master never ran (${KA_MASTER_MARKER} absent)" ka_notified

  ka_wait 20 'VI_UNSAFE never reached MASTER' ka_logged '(VI_UNSAFE) Entering MASTER STATE'
  ka_wait 5 'no refusal logged for the world-writable notify script' ka_logged 'Unsafe permissions found for script'
  # Single-shot absence, after the refusal wait above proved the line keepalived
  # logs when it disables a script is already in this log.
  if docker exec "$SMOKE_CONTAINER" test -e "$KA_UNSAFE_MARKER"; then
    printf 'FAIL: keepalived ran a world-writable notify script\n' >&2
    return 1
  fi

  ka_faults_before=$(ka_log_count "$KA_FAULT_LINE")
  docker exec "$SMOKE_CONTAINER" touch "$KA_FAULT_FILE"
  ka_wait 15 'a failing tracked script did not put VI_TEST in FAULT' ka_count_grew "$KA_FAULT_LINE" "$ka_faults_before"
  ka_wait 10 "VI_TEST entered FAULT but still holds ${KA_VIP}" ka_released_vip
  docker exec "$SMOKE_CONTAINER" rm -f "$KA_FAULT_FILE"
  ka_wait 20 "VI_TEST did not retake ${KA_VIP} after its tracked script recovered" ka_holds_vip

  # The FAULT transition above already sent a priority-zero advert of its own, so
  # the baseline belongs here, after it, and the shutdown must add a new one.
  ka_zeros_before=$(ka_log_count "$KA_ZERO_PRIO_LINE")
  docker stop --time 10 "$SMOKE_CONTAINER" >/dev/null
  ka_wait 10 'graceful shutdown emitted no new priority-zero advert' ka_count_grew "$KA_ZERO_PRIO_LINE" "$ka_zeros_before"

  # Every ka_wait above is silent on success, so name what was proved: a run that
  # drove all four transitions and one whose hook returned early otherwise print
  # the same thing, leaving the harness's elapsed time unaccountable.
  printf 'keepalived payload: VI_TEST took MASTER and put %s on %s with notify_master run, the world-writable notify script was refused and never ran, a failing tracked script drove FAULT and released the VIP before recovery retook it, and the graceful stop emitted a new priority-zero advert\n' "$KA_VIP" "$KA_IFACE"
}
