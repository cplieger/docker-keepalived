# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced from cplieger/ci). Runs the assembled image with the same
# fixture the build-time smoke test parses, mounted at the compiled-in
# default config path so the real ENTRYPOINT is exercised with no -f, and
# waits for the baked HEALTHCHECK to report healthy. That is the only
# check anywhere that executes the entrypoint flag set and the pidof
# probe; the build-time test invokes the binary directly.
SMOKE_APP_NAME=docker-keepalived
# HEALTHCHECK start-period is 15s; 90 covers it plus two 30s intervals.
SMOKE_TIMEOUT=90
SMOKE_RUN_ARGS="--cap-add NET_ADMIN --cap-add NET_RAW -v ${SMOKE_DIR}/keepalived.conf:/etc/keepalived/keepalived.conf:ro"
