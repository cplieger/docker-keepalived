# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced from cplieger/ci). Runs the assembled image with the same
# fixture the build-time smoke test parses, mounted at the compiled-in
# default config path so the real ENTRYPOINT is exercised with no -f, and
# waits for the baked HEALTHCHECK to report healthy. That is the only
# check anywhere that executes the entrypoint flag set and the pidof
# probe; the build-time test invokes the binary directly.
SMOKE_APP_NAME=docker-keepalived
# HEALTHCHECK start-period is 15s; 90 covers it plus two 30s intervals.
SMOKE_TIMEOUT=90
SMOKE_RUN_ARGS="--cap-add NET_ADMIN --cap-add NET_RAW -v ${SMOKE_DIR}/keepalived.conf:/etc/keepalived/keepalived.conf:ro"
# pidof is satisfied by the parent alone, and keepalived keeps the parent
# running when it parsed no VRRP configuration ("Warning - keepalived has
# no configuration to run"). The parent logs this line only when the
# mounted config yielded VRRP configuration, so it is what proves the
# mount was read.
SMOKE_LOG_PATTERN="Starting VRRP child process"

verify_alert_selectors_match_compose() {
  repo_root=${SMOKE_DIR%/tests}
  container_name=$(docker compose -f "$repo_root/compose.yaml" config --format json | jq -er '.services.keepalived.container_name') || {
    printf '%s\n' 'FAIL: compose.yaml has no resolved keepalived container name' >&2
    return 1
  }
  selectors=$(grep -o 'container="[^"]*"' "$repo_root/alerts.yaml" | sort -u)
  if [ "$selectors" != "container=\"$container_name\"" ]; then
    printf 'FAIL: alerts.yaml selectors (%s) do not all match compose container_name %s\n' "$(printf '%s' "$selectors" | tr '\n' ' ')" "$container_name" >&2
    return 1
  fi
  # Every alert LEG carries exactly one count_over_time( and must carry
  # exactly one stream selector, so these two counts are equal. Exact, not
  # bounded: a single leg that loses or re-keys its selector makes them
  # differ. Counting `- alert:` lines instead would need four selectors to
  # vanish before it said anything, because two rules carry two legs each.
  legs=$(grep -c 'count_over_time(' "$repo_root/alerts.yaml")
  matches=$(grep -c 'container="' "$repo_root/alerts.yaml")
  if [ "$legs" != "$matches" ]; then
    printf 'FAIL: alerts.yaml has %s alert legs but %s container selectors\n' "$legs" "$matches" >&2
    return 1
  fi
}
verify_alert_selectors_match_compose

verify_compose_contract() {
  repo_root=${SMOKE_DIR%/tests}
  compose_json=$(docker compose -f "$repo_root/compose.yaml" config --format json) || {
    printf '%s\n' 'FAIL: compose.yaml does not resolve' >&2
    return 1
  }
  # Three of these four have a runtime outcome: without host networking the
  # container cannot see VRRP multicast, without NET_ADMIN it cannot move the
  # VIP, without NET_RAW it cannot build an advert. The fourth is pinned for a
  # different reason and it is not generic hardening: README "Security"
  # publishes /etc/keepalived read-only as the only bind mount the image
  # needs, and a writable one gives a root container holding NET_ADMIN write
  # access to the very track and notify scripts keepalived executes.
  if ! printf '%s\n' "$compose_json" | jq -e '
    .services.keepalived
    | .network_mode == "host"
      and ((.cap_add | index("NET_ADMIN")) != null)
      and ((.cap_add | index("NET_RAW")) != null)
      and any(.volumes[]; .target == "/etc/keepalived" and .read_only == true)
  ' >/dev/null; then
    printf '%s\n' 'FAIL: compose.yaml must keep host networking, NET_ADMIN, NET_RAW, and a read-only /etc/keepalived mount' >&2
    return 1
  fi
}
verify_compose_contract

smoke_verify() {
  deadline=$(($(date +%s) + 15))
  while [ "$(date +%s)" -lt "$deadline" ]; do
    if docker logs "$SMOKE_CONTAINER" 2>&1 | grep -qF -- 'Entering MASTER STATE'; then
      break
    fi
    sleep 1
  done
  if ! docker logs "$SMOKE_CONTAINER" 2>&1 | grep -qF -- 'Entering MASTER STATE'; then
    printf '%s\n' 'FAIL: VI_TEST did not become MASTER before the shutdown probe' >&2
    return 1
  fi

  docker stop --time 10 "$SMOKE_CONTAINER" >/dev/null
  deadline=$(($(date +%s) + 10))
  while [ "$(date +%s)" -lt "$deadline" ]; do
    if docker logs "$SMOKE_CONTAINER" 2>&1 | grep -qF -- '(VI_TEST) sent 0 priority'; then
      return 0
    fi
    sleep 1
  done
  printf '%s\n' 'FAIL: graceful shutdown emitted no detail-level priority-zero event' >&2
  return 1
}
