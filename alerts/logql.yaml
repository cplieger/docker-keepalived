# Recommended alert rules for docker-keepalived. Loki ruler (LogQL) rule group:
# ship the container's logs to Loki and evaluate with Loki's ruler; firing
# alerts deliver through your Alertmanager like any Prometheus alert. Thresholds
# and the severity labels are starting points; adjust the container and label
# selectors to your deployment.
#
# Each matcher keys on wording from a format string in the pinned keepalived
# release, but six do so through a regex rather than a plain substring:
# TrackScriptFailed binds the status word to its own field with a word
# boundary, FaultState spans two upstream casings, and DuplicateMaster,
# ConfigError, PermanentError and ScriptDisabled each alternate over several
# patterns. Read a matcher edit for regex semantics as well as for wording drift.
# tests/smoke.sh's alert-anchor loop asserts the discriminating literals against
# the shipped binary; keep the two in step. It cannot anchor the bare status word
# 'failed' - upstream stores it separately from the format string it lands
# in, and the binary carries unrelated strings containing it, so a grep for
# it could never fail. That one word is ungated: re-read it against the
# sources on a keepalived bump.
# README.md restates what these rules mean and the operator guidance they
# depend on — the Alerting table and the surrounding operator sections —
# and nothing checks the two agree, so an edit here that changes what a
# rule means, when it fires, or which keepalived directives it talks about
# is an edit there too.
groups:
  - name: keepalived
    rules:
      # Both state rules below read the LATEST status per object rather than counting
      # events, because keepalived logs a track script and a VRRP state only on CHANGE.
      # A count over a window cannot tell "failed and still failing" from "failed and
      # recovered" — it sees one line either way — so an event-shaped rule pages on every
      # rolling redeploy of the tracked service. `last_over_time` on a 0/1 label is
      # order-aware: the recovery line drives the value back to 0 and the alert clears by
      # itself, and the `for` window is what a genuine outage has to outlive. The lookback
      # is the rule's MEMORY of the current state, not a detection window, so a long one
      # costs nothing and only extends how long a real fault keeps paging.
      - alert: KeepalivedTrackScriptFailed
        expr: |
          max by (hostname, script) (
            last_over_time(
              {container="keepalived"} |= "VRRP_Script("
                |~ "VRRP_Script\\(.*\\) (failed|timed_out|succeeded)\\b"
                | regexp "VRRP_Script\\((?P<script>[^)]+)\\) (?P<vstatus>failed|timed_out|succeeded)"
                | label_format bad=`{{ if eq .vstatus "succeeded" }}0{{ else }}1{{ end }}`
                | drop vstatus, detected_level
                | unwrap bad [6h]
            )
          ) > 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Keepalived track script {{ $labels.script }} failing"
          description: >
            Keepalived track script {{ $labels.script }} has been failed or timed out for
            over 3 minutes with no recovery, so the monitored service is genuinely down
            rather than restarting, and this node has dropped out of the VRRP election.
            A recreate of the tracked container recovers in tens of seconds and is
            deliberately below this threshold — raise `for` if your service starts slower.
      - alert: KeepalivedFaultState
        expr: |
          max by (hostname, vrrp_instance) (
            last_over_time(
              {container="keepalived"}
                |~ "(?i)\\(VI_[^)]+\\):? entering (FAULT|BACKUP|MASTER) STATE"
                | regexp "(?i)\\((?P<vrrp_instance>VI_[^)]+)\\):? entering (?P<vstate>fault|backup|master) state"
                | label_format faulted=`{{ if eq (lower .vstate) "fault" }}1{{ else }}0{{ end }}`
                | drop vstate, detected_level
                | unwrap faulted [6h]
            )
          ) > 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Keepalived instance {{ $labels.vrrp_instance }} stuck in FAULT state"
          description: >
            VRRP instance {{ $labels.vrrp_instance }} has been in FAULT state for over 3
            minutes, so this node is out of the VRRP election and not recovering on its
            own, and the VIP has failed over to a backup node. Any tracked object can
            cause it: a failed track script, file or process, the tracked interface going
            down, or no usable address on it. Check the log lines just before the FAULT
            for which one it was. Entering BACKUP or MASTER is the recovery, so a brief
            FAULT during a redeploy resolves itself and does not alert. The matcher is
            case-insensitive and colon-tolerant on purpose: keepalived spells this
            "Entering FAULT STATE" for a track-script cause and "entering FAULT state"
            for an interface, address, tracked-file or tracked-process cause.
      - alert: KeepalivedDuplicateMaster
        expr: |
          sum by (hostname) (count_over_time(
            {container="keepalived"}
            |~ "please resolve|equal priority advert received from remote host with our IP address" [15m]
          )) > 0
          or sum by (hostname) (count_over_time(
            {container="keepalived"} |~ "with lower priority [0-9]+, ours" [30m]
          )) > 5
          or sum by (hostname) (count_over_time(
            {container="keepalived"}
            |~ "invalid passwd|Invalid auth type|[0-9]+ auth from|wrong VRRP version|interval mismatch with|icast packet but received" [15m]
          )) > 0
          or sum by (hostname) (count_over_time(
            {container="keepalived"}
            |~ "authentication (trailer|HMAC|key id)|not a unicast peer|TTL/HL" [15m]
          )) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Keepalived duplicate master detected"
          description: >
            Two nodes hold the same VRRP address at the same time, so traffic
            to the VIP splits between them. keepalived detects this per node
            and names the offending peer. An address-owner conflict logs
            "CONFIGURATION ERROR ... please resolve". An advert that arrives
            carrying this node's own address logs an equal-priority advert
            from a remote host with our IP address. A master that keeps
            receiving lower-priority adverts logs one line per advert, which
            is why that leg needs more than 5 lines in 30m: one or two also
            arrive during a legitimate failback. That count assumes a short
            advert_int; at the accepted maximum of 255s, 30m carries only
            about seven adverts, so raise the window or lower the threshold if
            your advert_int is long. Check auth_pass, virtual_router_id, and
            whether multicast passes in both directions. A peer whose adverts
            this node REJECTS produces the same two masters with none of the
            lines above, because every rejection returns before them.
            keepalived names the reason once per cause - an auth password
            mismatch, an auth type mismatch where neither side is AH, a wrong
            VRRP version, a VRRPv2 advertisement interval mismatch, or unicast
            adverts on a multicast instance and vice versa - and not again
            until the instance changes state, so that leg reports the ONSET of
            the fault rather than the standing fault. Five causes never reach
            this rule at all: a virtual_router_id mismatch logs nothing unless
            global_defs sets log_unknown_vrids; a mismatched virtual_ipaddress
            set is logged without rejecting the advert; an auth_type mismatch
            where one side uses AH changes the IP protocol number of the
            adverts, so neither node receives the other's or logs a reason; an
            address owner running owner_ignore_adverts drops every advert before
            the address-owner lines above and logs only "Dropping packet(s) ...
            since we are address owner"; and a checksum rejection, which one
            node holding v3_checksum_as_v2 or unicast_chksum_compat and its peer
            not is enough to produce. The checksum line stays unmatched because
            a single corrupted advert on the wire produces the same "Invalid
            VRRPv2 checksum" or "Invalid VRRPv3 checksum" line, so matching it
            would page critical for one bad packet. A third family of rejections
            never reaches the advert's fields at all, and the fourth leg reports
            it. With `auth_hmac` configured, a missing, malformed, stale or
            replayed authentication trailer, an unknown key id or a bad HMAC is
            refused before any field is read - a clock skewed past `time_window`
            is enough. With `check_unicast_src` set, or a `min_ttl`/`max_ttl` on
            a `unicast_peer` line, which sets it, an advert from an address that
            is not in this instance's `unicast_peer` list is refused, and so is
            one whose TTL or hop limit falls outside that peer's
            `min_ttl`/`max_ttl` range. One arm of that leg
            is not a misconfiguration: a multicast advert whose TTL is not 255
            was routed or forged, so a match there with none of the config
            causes above points at the network rather than at either
            keepalived.conf.
      - alert: KeepalivedConfigError
        expr: |
          sum by (hostname) (count_over_time(
            {container="keepalived"}
            |~ "Unknown keyword|\\(([^)]*: )?Line [0-9]+\\)|(Unable to (read|find)|Failed to open) configuration file|Configuration file '" [15m]
          )) > 0
          or sum by (hostname) (count_over_time(
            {container="keepalived"}
            |~ "specify unicast peers|has no configuration to run|at a reload - please restart|auth_hmac active_key" [15m]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Keepalived config error"
          description: >
            keepalived logged a config error and kept running with it: an
            unknown keyword (the directive is silently ignored), a "(Line
            N)"-prefixed parse error such as an invalid directive value, a
            config file it could not open, read or find or would not treat as
            a regular non-executable file, a VRRP instance disabled by a config
            fault such as an interface that cannot do multicast, a config that
            parsed but declared no VRRP instance or LVS virtual server at all,
            or a reload it refused outright ("Cannot change ... at a reload -
            please restart keepalived"), which leaves every edit in that file
            unapplied while the old config keeps serving, or an auth_hmac
            active_key that names no defined key (keepalived drops the whole
            authentication extension and the instance runs unauthenticated, so
            the DuplicateMaster authentication leg cannot report for it).
            Review your keepalived.conf. Two arms mean the opposite at container
            START: a main config keepalived cannot read, find or open, or skips as
            not a regular non-executable file, makes it exit before any child
            starts, so the container crash-loops, the pidof healthcheck never
            reports healthy, and KeepalivedPermanentError stays silent because no
            child died. Those same lines mean the daemon carried on when the file
            was an include re-read instead. A script keepalived will not run is
            KeepalivedScriptDisabled; a config fault that terminates a started
            child is KeepalivedPermanentError.
      - alert: KeepalivedScriptDisabled
        expr: |
          sum by (hostname) (count_over_time({container="keepalived"} |~ "script.*- disabling|Disabling track script|Wrong file type found in script path|cannot be accessed - " [15m])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Keepalived refused to run a track or notify script"
          description: >
            keepalived would not run a script and disabled it. Which failover
            guarantee that breaks depends on the script's ROLE, and most of the
            matched lines do not say: the same permission and lookup checks
            refuse a track_script and a notify_master/backup/fault script
            alike. Only "Disabling track script" is unambiguous. A refused
            TRACK script means the object it tracked is never evaluated, so
            this node's priority never drops and it keeps the VIP through an
            outage of the very service the script was installed to watch. A
            refused NOTIFY script means the transition still happens but the
            side effect the operator attached to it does not - an address or
            route the new MASTER was supposed to install never appears.
            Identify the script named in the line before acting. Nothing else
            reports either state: the daemon runs, VRRP works, and the pidof
            healthcheck stays green. The usual cause is path permissions under
            enable_script_security, so see README "enable_script_security"; it
            also fires for a script keepalived cannot find, cannot execute as
            its run-as user, or cannot set uid/gid for.
      - alert: KeepalivedPermanentError
        expr: |
          sum by (hostname) (count_over_time(
            {container="keepalived"}
            |~ "exited with permanent error|Non-existent interface specified in configuration" [15m]
          )) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Keepalived hit a permanent error and terminated"
          description: >
            A keepalived child ended with a permanent error, so the parent
            logged "exited with permanent error CONFIG" (also FATAL, or
            missing permission) and terminated too. The container exits and
            the restart policy crash-loops it, so this node holds no VIP at
            all. That one line covers the whole class: an interface named in
            the config that does not exist on the host, two VRRP instances
            that share a virtual_router_id on one interface, and any other
            config the daemon refuses outright. KeepalivedChildRespawned
            cannot fire for these, because the parent terminates instead of
            respawning the child. Read the error logged just before the
            terminal line for the cause.
      - alert: KeepalivedChildRespawned
        expr: |
          sum by (hostname) (count_over_time({container="keepalived"} |= "died: Respawning" [15m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Keepalived child process died and was respawned"
          description: >
            A keepalived child process died and the parent respawned it; the log
            line names which child. For the VRRP child, it owns the virtual IPs,
            so they moved off this node and back, stranding every long-lived
            connection through it. For the Healthcheck child, the VIPs stay put
            and only LVS real-server checking paused. The container healthcheck
            cannot see either case: the parent survives. Check the log lines just
            before this one for the child's exit status.
      - alert: KeepalivedMemlockFailed
        expr: |
          sum by (hostname) (count_over_time({container="keepalived"} |= "Unable to lock process in memory" [15m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Keepalived could not lock memory (vrrp_no_swap inert)"
          description: >
            keepalived's config asks for vrrp_no_swap (or checker_no_swap) but
            mlockall failed, so the option is inert for the
            life of this process and the child can be swapped out. keepalived
            appends the errno to that log line: read it, then check both the
            container's locked-memory limit (RLIMIT_MEMLOCK, see README
            "Resource limits") and whether the container has CAP_IPC_LOCK.
            keepalived logs this once at startup and carries on, so nothing
            else reports it.
