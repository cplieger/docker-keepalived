# Recommended LogQL alert rules for docker-keepalived, for Loki's ruler.
# Ship the container's logs to Loki and load this file into Loki's ruler.
# Firing alerts go through your Alertmanager like any Prometheus alert.
# Thresholds and severity labels are starting points. Change the container
# selector and the hostname grouping to the labels your log collector sets.
# Each matcher keys on log wording from the pinned keepalived release, and
# tests/smoke.sh checks those strings against the shipped binary.
# docs/monitoring.md explains each rule and docs/configuration.md the settings
# they depend on. Nothing checks those pages against this file, so update them
# with any change to what a rule means or when it fires.
groups:
  - name: keepalived
    rules:
      # Both state rules read the latest status per object instead of counting
      # events, because keepalived logs a status only when it changes. The 7d
      # range is how long the rule remembers a standing fault.
      # docs/monitoring.md explains how to size it.
      - alert: KeepalivedTrackScriptFailed
        expr: |
          max by (hostname, script) (
            last_over_time(
              {container="keepalived"} |= "VRRP_Script("
                |~ "VRRP_Script\\(.*\\) (failed|timed_out|succeeded)\\b"
                | regexp "VRRP_Script\\((?P<script>[^)]+)\\) (?P<vstatus>failed|timed_out|succeeded)"
                | label_format bad=`{{ if eq .vstatus "succeeded" }}0{{ else }}1{{ end }}`
                | drop vstatus, detected_level
                | unwrap bad [7d]
            )
          ) > 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Keepalived track script {{ $labels.script }} failing"
          description: >
            Track script {{ $labels.script }} has failed or timed out for 3
            minutes, so the service it watches is down. Check that service and
            this node's VRRP state. A resolve with no succeeded line may not
            be a recovery.
      - alert: KeepalivedFaultState
        expr: |
          max by (hostname, vrrp_instance) (
            last_over_time(
              {container="keepalived"}
                |~ "(?i)\\(([^)]+)\\):? entering (FAULT|BACKUP|MASTER) STATE"
                | regexp "(?i)\\((?P<vrrp_instance>[^)]+)\\):? entering (?P<vstate>fault|backup|master) state"
                | label_format faulted=`{{ if eq (lower .vstate) "fault" }}1{{ else }}0{{ end }}`
                | drop vstate, detected_level
                | unwrap faulted [7d]
            )
          ) > 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Keepalived instance {{ $labels.vrrp_instance }} stuck in FAULT state"
          description: >
            Instance {{ $labels.vrrp_instance }} is in FAULT and its addresses
            are off this node. Check that a peer holds them, then read the
            lines before the FAULT. A resolve with no BACKUP or MASTER line
            may not be a recovery.
      - alert: KeepalivedDuplicateMaster
        expr: |
          sum by (hostname) (count_over_time(
            {container="keepalived"}
            |~ "please resolve|equal priority advert received from remote host with our IP address" [15m]
          )) > 0
          or sum by (hostname) (count_over_time(
            {container="keepalived"} |~ "with lower priority [0-9]+, ours" [30m]
          )) > 5
          or sum by (hostname) (count_over_time(
            {container="keepalived"}
            |~ "invalid passwd|Invalid auth type|[0-9]+ auth from|wrong VRRP version|interval mismatch with|icast packet but received" [15m]
          )) > 0
          or sum by (hostname) (count_over_time(
            {container="keepalived"}
            |~ "authentication (trailer|HMAC|key id)|not a unicast peer|TTL/HL" [15m]
          )) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Keepalived reports two masters, or an advert this node refused"
          description: >
            Two nodes may hold the same VRRP address and split its traffic.
            Read the reason on the matched line, then check auth_pass,
            virtual_router_id and that multicast passes both ways. A refused
            advert from a non-peer means no conflict.
      - alert: KeepalivedConfigError
        expr: |
          sum by (hostname) (count_over_time(
            {container="keepalived"}
            |~ "Unknown keyword|\\(([^)]*: )?Line [0-9]+\\)"
            !~ "Line [0-9]+\\) Configuration file '" [15m]
          )) > 0
          or sum by (hostname) (count_over_time(
            {container="keepalived"}
            |~ "specify unicast peers|at a reload - please restart|auth_hmac active_key" [15m]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Keepalived config error"
          description: >
            keepalived logged a config error and kept running. An unknown
            keyword is ignored, and a refused reload leaves every edit
            unapplied until a restart. Read the matched line, then review your
            keepalived.conf.
      - alert: KeepalivedConfigUnusable
        expr: |
          sum by (hostname) (count_over_time(
            {container="keepalived"}
            |~ "(Unable to read|Failed to open) configuration file|Configuration file '" [15m]
          )) > 0
          or sum by (hostname) (count_over_time(
            {container="keepalived"}
            |~ "has no configuration to run" [15m]
          )) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Keepalived could not use all or part of its VRRP configuration"
          description: >
            keepalived could not use all or part of your config. An unreadable
            main config crash-loops the container, a skipped include drops
            that file, and a config with nothing to run leaves keepalived
            idle. Check the named file and its mode.
      - alert: KeepalivedScriptDisabled
        expr: |
          sum by (hostname) (count_over_time({container="keepalived"} |~ "script.*- disabling|Disabling track script|Wrong file type found in script path|cannot be accessed - " [15m])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Keepalived refused to run a track or notify script"
          description: >
            keepalived refused to run a script and disabled it. A refused
            track script never fails this node over, and a refused notify
            script skips its side effect. The healthcheck stays green. Check
            the named script's permissions under enable_script_security.
      - alert: KeepalivedScriptExecFailed
        expr: |
          sum by (hostname) (count_over_time(
            {container="keepalived"}
            |~ "Error exec-ing command|Couldn't (find|execute) command" [15m]
          )) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Keepalived could not execute a track or notify script"
          description: >
            keepalived could not execute the track or notify script the line
            names. A track script that fails this way counts as succeeded, so
            this node keeps the virtual IP. Check the script's interpreter
            line and whether its mount is noexec.
      - alert: KeepalivedPermanentError
        expr: |
          sum by (hostname) (count_over_time(
            {container="keepalived"}
            |~ "exited with permanent error|Non-existent interface specified in configuration" [15m]
          )) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Keepalived hit a permanent error and terminated"
          description: >
            A keepalived child ended with a permanent error and the parent
            stopped, so the container restarts in a loop and this node holds
            no virtual IP. Read the error logged just before the "exited with
            permanent error" line.
      - alert: KeepalivedChildRespawned
        expr: |
          sum by (hostname) (count_over_time({container="keepalived"} |= "died: Respawning" [15m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Keepalived child process died and was respawned"
          description: >
            The keepalived child the line names died and was respawned. A VRRP
            child that was MASTER moved the virtual IPs off this node and
            back, which breaks long-lived connections. Read the lines before
            this one for the exit status.
      - alert: KeepalivedMemlockFailed
        expr: |
          sum by (hostname) (count_over_time({container="keepalived"} |= "Unable to lock process in memory" [15m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Keepalived could not lock memory, so vrrp_no_swap is inert"
          description: >
            mlockall failed, so vrrp_no_swap or checker_no_swap is inert and
            the child can be swapped out. keepalived logs this once at
            startup. Read the error on the line, then check the container's
            memlock limit and CAP_IPC_LOCK.
      - alert: KeepalivedVIPOperationRefused
        expr: |
          sum by (hostname) (count_over_time(
            {container="keepalived"}
            |~ "Netlink: error: .*type=RTM_(NEW|DEL)(ADDR|ROUTE|RULE)|Not adding address "
            !~ "Netlink: error: .*\\(3\\), type=RTM_DELROUTE" [15m]
          )) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Keepalived could not add or release a virtual address, route or rule"
          description: >
            The kernel refused to add or release a virtual address, route or
            rule, and keepalived carried on as if it worked. A refused add
            leaves the virtual IP on no node. Check the container's NET_ADMIN
            capability and the named interface.
